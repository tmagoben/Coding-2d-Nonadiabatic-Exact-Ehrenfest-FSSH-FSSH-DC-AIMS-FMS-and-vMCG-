name: Gaussian dynamics validation

on:
  push:
    branches:
      - main
      - integration/v0295-main-20261009
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile development modules
        run: python -m py_compile v294_preml_contract.py test_v294_preml_contract.py v295_oracle_dataset.py test_v295_oracle_dataset.py
      - name: Run cumulative scientific and development tests
        run: python -m pytest -q tests test_v294_preml_contract.py test_v295_oracle_dataset.py
