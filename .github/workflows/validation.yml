name: Gaussian dynamics validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  development-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile development modules
        run: python -m py_compile gaussian_dynamics/molecular_hamiltonian_v301.py gaussian_dynamics/molecular_midpoint_v302.py gaussian_dynamics/molecular_spawn_v304.py gaussian_dynamics/molecular_admission_v305.py gaussian_dynamics/molecular_dataset_v305.py gaussian_dynamics/molecular_active_v306.py gaussian_dynamics/molecular_adaptive_v306.py gaussian_dynamics/v302_benchmark.py gaussian_dynamics/v303_benchmark.py gaussian_dynamics/v304_benchmark.py gaussian_dynamics/v305_benchmark.py gaussian_dynamics/v306_benchmark.py v294_preml_contract.py test_v294_preml_contract.py v295_oracle_dataset.py test_v295_oracle_dataset.py
      - name: Validate moving-frame and dataset integration
        run: |
          python -m pytest -q --junitxml=results/development-junit.xml \
            tests/test_v0280_moving_frame.py \
            tests/test_v0280_evidence.py \
            tests/test_v0280_lattice_validation.py \
            tests/test_v0292_curved_basis_adaptation.py \
            tests/test_v0293_coordinate_dependent_geometry.py \
            tests/test_v0294_pre_ml_contract.py \
            tests/test_v0300_molecular_frame_bridge.py \
            tests/test_v0301_molecular_hamiltonian.py \
            tests/test_v0302_molecular_midpoint.py \
            tests/test_v0303_soc_trajectory.py \
            tests/test_v0304_complete_spawn_tangent.py \
            tests/test_v0304_molecular_spawning.py \
            tests/test_v0304_spawn_evidence.py \
            tests/test_v0305_molecular_admission.py \
            tests/test_v0305_molecular_dataset.py \
            tests/test_v0305_admission_evidence.py \
            tests/test_v0306_active_propagation.py \
            tests/test_v0306_active_invariance.py \
            tests/test_v0306_adaptive_trajectory.py \
            tests/test_v0306_adaptive_evidence.py \
            test_v294_preml_contract.py \
            test_v295_oracle_dataset.py
      - name: Recompute midpoint convergence and replay evidence
        run: python examples/159_recompute_v0302_molecular_midpoint.py
      - name: Upload development validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-validation
          path: |
            results/development-junit.xml
            results/v0302_molecular_midpoint_evidence.json

  molecular-soc-trajectories:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and numerical dependencies
        run: python -m pip install -e "."
      - name: Recompute SOC trajectory refinement and disabled-SOC control
        run: python examples/160_recompute_v0303_soc_trajectory.py --output results/ci-v0303-soc-trajectory.json
      - name: Upload fresh SOC trajectory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-soc-trajectory-validation
          path: results/ci-v0303-soc-trajectory.json

  molecular-spawn-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and numerical dependencies
        run: python -m pip install -e "."
      - name: Recompute full-Hamiltonian spawn scores and replay
        run: python examples/161_recompute_v0304_molecular_spawning.py --output results/ci-v0304-molecular-spawning.json
      - name: Upload fresh molecular spawning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-spawn-oracle-validation
          path: results/ci-v0304-molecular-spawning.json

  molecular-spawn-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and numerical dependencies
        run: python -m pip install -e "."
      - name: Recompute final admission and replay-verified dataset
        run: python examples/162_recompute_v0305_molecular_admission.py --output results/ci-v0305-molecular-admission.json
      - name: Upload fresh admission evidence and dataset rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-spawn-admission-validation
          path: |
            results/ci-v0305-molecular-admission.json
            results/ci-v0305-molecular-admission.jsonl

  molecular-adaptive-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and numerical dependencies
        run: python -m pip install -e "."
      - name: Recompute unseeded activation, repeated admission and full replay
        run: python examples/163_recompute_v0306_adaptive_propagation.py --output results/ci-v0306-adaptive-propagation.json
      - name: Upload fresh adaptive lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-adaptive-lifecycle-validation
          path: results/ci-v0306-adaptive-propagation.json

  cumulative-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [core, release-early, release-late]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned scientific runtime and test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-pyscf-v270-linux-x86_64-py312.txt
          python -m pip install -e ".[pyscf,dev]"
          python -m pip check
      - name: Run all scientific regression and development tests
        env:
          REGRESSION_SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pytest
          early = {f"test_v{v}_release.py" for v in ("0233", "0240", "0241", "0242", "0250", "0251", "0252")}
          late = {f"test_v{v}_release.py" for v in ("0253", "0260", "0270")}
          groups = {"core": [], "release-early": [], "release-late": []}
          for path in sorted(Path("tests").rglob("test_*.py")):
              group = "release-early" if path.name in early else "release-late" if path.name in late else "core"
              groups[group].append(str(path))
          groups["core"] += ["test_v294_preml_contract.py", "test_v295_oracle_dataset.py"]
          selected = groups[os.environ["REGRESSION_SHARD"]]
          assert selected
          raise SystemExit(pytest.main(["-q", "--junitxml=results/cumulative-junit.xml", *selected]))
          PY
      - name: Upload cumulative test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-regression-${{ matrix.shard }}
          path: |
            results/cumulative-junit.xml
            results/ci-campaign-*.json
