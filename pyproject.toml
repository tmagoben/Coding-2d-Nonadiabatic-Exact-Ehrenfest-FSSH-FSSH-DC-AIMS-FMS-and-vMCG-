[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-nadyn"
version = "0.27.0"
description = "Rotation-covariant correlated-width Gaussian nonadiabatic TDVP dynamics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
pyscf = ["pyscf==2.13.1"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["gaussian_dynamics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
