[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedagogical-nonadiabatic-dynamics"
version = "0.2.0"
description = "Rigorous 1D and 2D derivative-coupling, diabatization, FFT, and direct-diagonalization examples"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nonadiabatic_dynamics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
